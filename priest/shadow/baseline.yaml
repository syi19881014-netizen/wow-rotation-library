core_principles:
  - "Maintain Vampiric Touch on worthwhile targets; use Tentacle Slam for coverage/charge protection."
  - "Maintain Shadow Word: Madness and prevent Insanity overcap."
  - "Voidweaver: Void Torrent establishes Entropic Rift; Void Blast is a high-value Rift action."
  - "Do not flatten Archon and Voidweaver into one priority list."

