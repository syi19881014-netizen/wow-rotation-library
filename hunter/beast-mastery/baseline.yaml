spec: Beast Mastery Hunter
wow_version: "12.1 / Midnight"
updated: 2026-08-25
status: PROVISIONAL_HIGH_CONFIDENCE

scope:
  focus: "AoE Beast Cleave / Wild Thrash / Bestial Wrath / Apex pet timing"
  priority_rewrite_required: true
  applies_when:
    - "talent.beast_cleave"
    - "multi_target"
    - "hero.pack_leader OR hero.dark_ranger"

source_evidence:
  simulationcraft:
    pack_leader_commit: "5d55482c9819b276a3d59880ca5d9996abf7eefa"
    dark_ranger_commit: "25faf4d747e9c4c655d86befb5f54162c43620d6"
    date_utc: "2026-08-24"
    finding: >-
      The Wild Thrash hold/reapply logic is now shared by Pack Leader and Dark
      Ranger AoE. For Dark Ranger, SimC changed Wild Thrash from unconditional
      use to: cast when Beast Cleave is absent, when the previous GCD was Bestial
      Wrath, or when Bestial Wrath will not become ready before Beast Cleave
      expires. Bestial Wrath itself remains gated by Beast Cleave being active
      when Beast Cleave is talented.
  practical:
    method_12_1:
      updated: "2026-08-17"
      finding: >-
        Method independently recommends the same timing concept for both Pack
        Leader and Dark Ranger AoE: when possible, Wild Thrash about two globals
        before Bestial Wrath and then Wild Thrash as the first global after
        Bestial Wrath. The Apex pet uses Bestial Wrath about 1.5s after the main
        pets and does not inherit Beast Cleave that existed before it spawned.
    wowhead_12_1:
      updated: "2026-08-16"
      finding: >-
        Current public guidance remains a simpler human-facing priority centered
        on Bestial Wrath uptime and Beast Cleave maintenance. It does not fully
        encode the Apex timing state machine, so use it as the stable practical
        approximation rather than as evidence against the newer hold logic.

states:
  AOE_BEAST_CLEAVE:
    inputs:
      - hero_tree
      - beast_cleave_remains
      - bestial_wrath_remains
      - wild_thrash_ready
      - previous_gcd
      - apex_pet_expected_event
    hero_scope:
      pack_leader: "enabled"
      dark_ranger: "enabled as of SimC 25faf4d"
    rules:
      - id: FORCE_POST_BW_WILD_THRASH
        status: PROVISIONAL_HIGH_CONFIDENCE
        when: "wild_thrash_ready AND previous_gcd == bestial_wrath"
        action: "Wild Thrash"
        rationale: >-
          Reapply Beast Cleave immediately after Bestial Wrath so the newly
          spawned Apex pet has Beast Cleave before its delayed Bestial Wrath
          damage event.
      - id: HOLD_WILD_THRASH_FOR_BW
        status: PROVISIONAL_HIGH_CONFIDENCE
        when: >-
          wild_thrash_ready AND beast_cleave_active AND
          bestial_wrath_remains <= beast_cleave_remains
        action: "hold Wild Thrash briefly for Bestial Wrath"
        max_hold: "approximately 2s in the current theorycraft/practical context"
        safeguard: >-
          Never let Beast Cleave fall off merely to wait for Bestial Wrath. If
          Beast Cleave is absent, Wild Thrash is immediately admitted.
      - id: BEAST_CLEAVE_DOWN
        status: STABLE
        when: "NOT beast_cleave_active AND wild_thrash_ready"
        action: "Wild Thrash"
      - id: DARK_RANGER_BW_GATE
        status: PROVISIONAL_HIGH_CONFIDENCE
        when: "hero.dark_ranger AND talent.beast_cleave"
        action: "Bestial Wrath only when Beast Cleave is active"
        rationale: >-
          Current Dark Ranger cleave APL explicitly gates Bestial Wrath on Beast
          Cleave being active, matching the need to protect the Apex/cleave window.

execution_policy:
  ordering: >-
    State sensing -> Hero state -> Beast Cleave maintenance -> Bestial Wrath
    admission -> post-Bestial-Wrath Wild Thrash -> normal AoE priority.
  forbidden_simplifications:
    - "Do not use Wild Thrash strictly on cooldown in every AoE state."
    - "Do not restrict the Wild Thrash hold/reapply logic to Pack Leader; current Dark Ranger AoE uses it too."
    - "Do not cast Bestial Wrath with Beast Cleave down when Wild Thrash can establish it."
    - "Do not assume the Apex pet inherits Beast Cleave that existed before Bestial Wrath."

scenario_guidance:
  simc_theoretical: >-
    Use the explicit Wild Thrash hold/force rules for both Pack Leader and Dark
    Ranger AoE; this is the current benchmark branch for Beast Cleave + Apex timing.
  high_end_practical: >-
    Method's current 12.1 guidance already applies the same timing concept to
    both hero trees: align Wild Thrash around Bestial Wrath and make Wild Thrash
    the first GCD after Bestial Wrath whenever possible.
  stable_human: >-
    Keep Beast Cleave active, do not overcap Barbed Shot, avoid wasting Bestial
    Wrath, and use Wild Thrash around Bestial Wrath without attempting sub-second
    hold logic.
  mplus_overrides:
    - "Do not hold Wild Thrash if the pack will die before the Apex event matters."
    - "Priority-target or movement/pet-travel constraints can override aggregate cleave optimization."
    - "If Beast Cleave would expire before Bestial Wrath is safely cast, refresh instead of forcing the hold."

live_verify:
  - "Exact safe hold duration under haste/latency and different GCD lengths."
  - "WCL frequency of Wild Thrash immediately after Bestial Wrath in top Season 2 M+ and raid AoE samples."
  - "Whether Dark Ranger and Pack Leader differ in practical hold tolerance despite sharing the current APL rule."
