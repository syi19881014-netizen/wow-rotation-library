    aoe_focus_dump_commit: ecf37b9f753023234ba9c29e5986d4814b5eeaf9
    latest_date: 2026-08-16
    summary: "Latest MM APL now distinguishes raid-style 2T cleave from DungeonRoute priority damage, suppresses S2 4pc Explosive Shot multidotting in priority-target DungeonRoute contexts, restricts Rapid Fire clipping to Unload builds, and adds an AoE Multi-Shot Focus-dump reserve rule."
  practical:
    wowhead:
      summary: "Current public Marksmanship guidance already treats Multi-Shot as the Precise Shots spender on 2+ targets in general rotation language, while the detailed priority-target/DungeonRoute exceptions and final-boundary clipping are not yet documented."
    method:
      summary: "Current Method guide remains 12.0.7-era and does not document these Season 2 DungeonRoute-specific refinements."
  official:
    summary: "Blizzard documents Unload and the Season 2 Explosive Shot redesign, but does not publish these APL routing rules as player-facing rotation instructions."
