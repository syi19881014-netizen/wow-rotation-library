  - "After live data is available, compare 2T Arcane-vs-Multi usage in raid cleave versus M+ priority-target pulls."
  - "Validate AoE Focus-dump frequency and whether the reserve rule ever delays Aimed Shot under realistic movement/latency."
  - "Validate Rapid Fire clip safety only in Unload builds and confirm no lost final tick/Unload event."
