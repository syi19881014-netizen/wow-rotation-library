    - "Preserve Aimed Shot Focus reserve before low-priority AoE dumps."
  provisional_machine_logic:
    - "Use explicit raid-vs-DungeonRoute priority branches for exactly 2 targets."
    - "Suppress Explosive Shot multidot cycling in DungeonRoute priority-target mode."
    - "Enable final-boundary Rapid Fire clipping only for Unload builds after latency-safe live validation."
