spec: Marksmanship Hunter
version: 12.1
updated: 2026-08-23
status: PROVISIONAL
scope:
  hero_talents:
    - Dark Ranger
    - Sentinel
  mechanics:
    - Rapid Fire channel-end / Precise Shots consumption
    - single-target versus AoE Rapid Fire clipping
    - Precise Shots ordering around Rapid Fire
    - 2-target Precise Shots spender selection
    - Explosive Shot priority-target routing
    - AoE Focus dumping
    - Trueshot / Explosive Shot cooldown alignment
    - 2-target Rapid Fire target routing
    - Aimed Shot nameplate routing
    - Aspect of the Hydra Rapid Fire tick behavior
rules:
  rapid_fire_clipping_context_split:
    status: PROVISIONAL_HIGH_CONFIDENCE
    supersedes: "The earlier universal Unload final-boundary clipping branch that also applied on single-target."
    single_target:
      action: "Do not deliberately clip Rapid Fire on single-target. Complete the channel unless a separate encounter/survival override applies."
      rationale: "SimC commit a011ae4 removes interrupt_if from both Dark Ranger ST and Sentinel ST Rapid Fire. Current Icy Veins 12.1 guidance likewise says Rapid Fire on cooldown on ST and only documents deliberate clipping in the AoE priority."
      cast_policy: MUST_COMPLETE
    aoe:
      action: "With Unload talented, deliberate final-boundary Rapid Fire clipping remains active in the AoE lists when fewer than 2 ticks remain, Precise Shots is active, and the GCD is ready. Follow with the legal Multi-Shot/Precise Shots spender according to the AoE branch."
      rationale: "The same SimC update explicitly keeps the interrupt_if branch in Sentinel AoE, and Icy Veins 12.1 documents clipping the end of Rapid Fire with Multi-Shot in AoE."
      cast_policy: "CAN_CLIP_IF(aoe_context AND unload_talented AND ticks_remain < 2 AND precise_shots_up AND gcd_ready AND valid_aoe_precise_shots_spender)"
    safeguards:
      - "Never infer that an optimization proven in AoE should also run on ST."
      - "Do not clip earlier than the final channel boundary."
      - "If target count falls to one during the channel, default back to MUST_COMPLETE unless the runtime can prove the AoE clipping event remains net-positive."

  single_target_precise_shots_before_rapid_fire:
    status: PROVISIONAL_HIGH_CONFIDENCE
    behavior: "On Sentinel ST with Unload + No Scope, Rapid Fire may be cast while Precise Shots is already active instead of always spending that Precise Shots first."
    simc_condition: "rapid_fire,if=buff.precise_shots.up&talent.unload&talent.no_scope appears ahead of the normal Kill Shot / Multi-Shot / Arcane Shot Precise Shots spenders in the 2026-08-22 Sentinel ST APL."
    interpretation: "Do not globally enforce 'every Precise Shots must be spent before Rapid Fire' on this talent combination. Rapid Fire is allowed to consume/sequence the existing state through Unload/No Scope mechanics."
    automation:
      gate: "single_target AND sentinel AND unload_talented AND no_scope_talented AND precise_shots_up AND rapid_fire_ready"
      safeguard: "This is a talent-specific ST admission rule, not a generic reason to overcap Precise Shots in other builds."

  precise_shots_two_target_split:
    status: PROVISIONAL
    condition: "Aspect of the Hydra talented and active_enemies >= 2"
    raid_or_non_priority_context:
      action: "Prefer Multi-Shot over Arcane Shot as the Precise Shots spender on exactly 2 targets when not in a DungeonRoute priority-target context."
    dungeonroute_priority_target_context:
      action: "On exactly 2 targets, prefer Arcane Shot for Precise Shots when DungeonRoute priority damage is active; Multi-Shot becomes allowed again at 3+ targets."
    automation:
      policy: "if active_enemies == 2 AND dungeonroute AND max_prio_damage => Arcane Shot; otherwise on 2+ eligible targets => Multi-Shot"

  aimed_shot_nameplate_routing:
    status: PROVISIONAL
    behavior: "In Sentinel AoE, the 2026-08-22 APL removes max_prio_damage from the Aimed Shot target_if gate and still prefers the target with Sentinel's Mark up."
    implication: "Nameplate-hunting for the marked Aimed Shot target can remain worthwhile in DungeonRoute even when it costs some immediate priority-target damage."
    automation:
      target_policy: "For Sentinel AoE Aimed Shot with Trick Shots remaining long enough for the cast, prefer Sentinel's Mark-up target; do not force current max-priority target solely because max_prio_damage is enabled."
      safeguard: "Encounter overrides may still pin a must-kill target when failure cost exceeds the modeled aggregate gain."

  explosive_shot_priority_routing:
    status: PROVISIONAL
    season2_4pc_multidot:
      action: "Allow Explosive Shot target-cycling/multidotting with the Season 2 4pc only when not in a DungeonRoute max-priority-damage context."
      priority_target_exception: "In DungeonRoute priority-target situations, do not cycle Explosive Shot across secondary targets solely for the 4pc; keep the normal priority-target Explosive Shot action instead."

  aoe_focus_dump:
    status: PROVISIONAL
    action: "Use Multi-Shot as a Focus dump before Steady Shot only when enough Focus remains to reserve the next Aimed Shot cost and the applicable damage-objective branch allows it."
    safeguard: "Never spend the Aimed Shot reserve."

  trueshot_explosive_shot_alignment:
    status: PROVISIONAL
    action: "Outside opener/end-of-fight overrides, allow a configurable Trueshot delay of up to roughly 15 seconds when Explosive Shot will become available inside that window."
    safeguard: "Do not convert this into a universal hard hold; DungeonRoute pull timing, imminent downtime, and losing a full Trueshot use override the alignment."

  rapid_fire_two_target_targeting:
    status: PROVISIONAL
    action: "On pure non-DungeonRoute 2-target encounters, Rapid Fire may target-swap to the target without Sentinel's Mark to improve aggregate damage; do not use this routing in DungeonRoute priority-damage contexts."

  hydra_rapid_fire_tick_behavior:
    status: PROVISIONAL_HIGH_CONFIDENCE
    behavior: "With Aspect of the Hydra, the secondary-target Rapid Fire copy triggers on every Rapid Fire channel tick in the corrected current live model; do not use the superseded alternating-tick assumption."
    automation:
      damage_model: "Account for a Hydra secondary event on every Rapid Fire tick."
      target_policy: "Keep TOTAL_DAMAGE versus PRIORITY_TARGET routing explicit."

evidence:
  simc:
    latest_apl_commit: a011ae422a21b9269a062c23c019c2996e1daa21
    latest_apl_date: 2026-08-22
    summary: "MM APL now removes deliberate Rapid Fire clipping on single-target, retains final-boundary clipping on AoE, allows Sentinel ST Rapid Fire before spending an existing Precise Shots state with Unload+No Scope, and removes the max-prio gate from Sentinel AoE Aimed Shot nameplate routing."
  practical:
    icy_veins:
      date_context: 2026-08-2026_12.1
      summary: "Current 12.1 rotation lists Rapid Fire on cooldown on ST, while the AoE section explicitly tells players to clip the end of Rapid Fire with Multi-Shot. It also keeps priority-target exceptions for Precise Shots spending. This strongly supports the ST/AoE clipping split."
    wowhead:
      summary: "Current ability guide describes Rapid Fire as a core on-cooldown ability and No Scope/Unload/Precise Shots interactions, but does not provide stronger evidence for ST clipping than the newer SimC + Icy Veins split."
  official:
    summary: "Patch 12.1 design heavily raises Rapid Fire value and preserves Deathblow/Unload interactions; no official note instructs players to deliberately clip Rapid Fire on single-target."
confidence:
  single_target_no_clip: HIGH_SIMC_AND_PRACTICAL
  aoe_final_boundary_clip: HIGH_SIMC_AND_PRACTICAL
  sentinel_st_rapid_fire_into_precise_shots: HIGH_SIMC_PROVISIONAL_PRACTICAL
  aimed_shot_nameplate_hunting_in_dungeonroute: HIGH_SIMC_PROVISIONAL_PRACTICAL
  two_target_raid_vs_dungeonroute_split: HIGH_SIMC_PROVISIONAL_PRACTICAL
  hydra_rapid_fire_every_tick: HIGH_SIMC_PROVISIONAL_LIVE
production_recommendation:
  stable_practical:
    - "Single-target Rapid Fire: complete the channel; remove deliberate Unload clipping from production ST logic."
    - "AoE Rapid Fire: allow final-boundary Multi-Shot clipping only with the proven Unload/Precise Shots/GCD conditions."
    - "Keep priority-target exceptions for Precise Shots spending."
    - "Preserve Aimed Shot Focus reserve before low-priority AoE dumps."
  provisional_machine_logic:
    - "Allow Sentinel ST Rapid Fire before consuming existing Precise Shots only for Unload + No Scope."
    - "Allow Sentinel AoE Aimed Shot nameplate-hunting for Sentinel's Mark even in DungeonRoute, with encounter must-kill override."
    - "Use explicit TOTAL_DAMAGE versus PRIORITY_TARGET branches for exactly 2 targets."
    - "Keep Hydra every-tick secondary-event modeling."
live_verify:
  - "Compare current 12.1 ST logs for deliberate Rapid Fire early termination; expectation after this update is that systematic ST clipping should disappear."
  - "Compare AoE logs for Multi-Shot casts at the final Rapid Fire boundary and measure lost final ticks versus gained Precise Shots value."
  - "Validate Sentinel ST sequences where Rapid Fire is cast while Precise Shots is already active with Unload + No Scope."
  - "Validate DungeonRoute Aimed Shot target swaps toward Sentinel's Mark targets and quantify priority-target loss versus aggregate gain."
