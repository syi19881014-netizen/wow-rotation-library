    latest_date: 2026-08-20
    summary: "Latest MM modeling now removes the old Aspect of the Hydra every-other-Rapid-Fire-tick bug assumption: Hydra's secondary Rapid Fire event triggers on every channel tick. Existing raid-vs-DungeonRoute priority splits, Unload clipping gate, Focus reserve, Trueshot/Explosive alignment and pure-2T routing remain otherwise unchanged."
  practical:
    wowhead:
      summary: "Current public Marksmanship guidance treats Aspect of the Hydra as a strong 2-target cleave talent and says Hydra-based AoE naturally follows the single-target priority, but does not document an every-other-tick restriction; this is directionally consistent with the corrected full-tick model."
    icy_veins:
      summary: "No newer public practical source found in this check that documents a different Rapid Fire/Hydra tick cadence or requires a GCD-priority rewrite."
  official:
    summary: "Blizzard's current public 12.1 notes describe Aspect of the Hydra as a cleave mechanic and update which abilities it includes, but do not specify a player-facing every-other-tick Rapid Fire restriction."
