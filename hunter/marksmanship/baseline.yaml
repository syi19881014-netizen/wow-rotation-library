  - "Confirm the exact safe interrupt/queue window under real latency and whether the final intended Rapid Fire/Unload events are always preserved."
  - "Check Season 2 top raid/M+ logs and hunter theorycrafter updates for repeatable use of Arcane Shot/Multi-Shot/other valid spender at the Rapid Fire boundary."
  - "Promote to production only after live evidence shows consistent gain without lost ticks or rotational desync."
