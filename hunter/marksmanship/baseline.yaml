spec: Marksmanship Hunter
version: 12.1
updated: 2026-08-21
status: PROVISIONAL
scope:
  hero_talents:
    - Dark Ranger
    - Sentinel
  mechanics:
    - Rapid Fire channel-end / Precise Shots consumption
    - 2-target Precise Shots spender selection
    - Explosive Shot priority-target routing
    - AoE Focus dumping
    - Trueshot / Explosive Shot cooldown alignment
    - 2-target Rapid Fire target routing
    - Aspect of the Hydra Rapid Fire tick behavior
rules:
  unload_precise_shots_channel_end:
    behavior: "The second Unload shot fired at Rapid Fire channel end consumes Precise Shots on a slight delay on live behavior as modeled by SimC bugs mode."
    theoretical_optimization:
      action: "Only with Unload talented, interrupt Rapid Fire at the final channel boundary when fewer than 2 ticks remain, Precise Shots is active, and the GCD is available, then immediately spend Precise Shots so both the second Unload shot and the spender can benefit."
      status: PROVISIONAL
      rationale: "SimulationCraft first modeled the delayed consumption, then adopted clipping into the Marksmanship APL, and on 2026-08-16 corrected the rule so clipping is legal only when talent.unload is selected."
    practical_baseline:
      action: "Complete Rapid Fire normally, then spend Precise Shots with the appropriate spender."
      status: STABLE_PRACTICAL
      rationale: "Current public practical guides still describe the normal full-channel flow and do not document deliberate final-boundary Rapid Fire clipping."
    automation:
      cast_policy: "CAN_CLIP_IF(unload_talented AND ticks_remain < 2 AND precise_shots_up AND gcd_ready AND valid_precise_shots_spender AND no_higher_priority_interrupt_risk)"
      safeguards:
        - "Without Unload talented, Rapid Fire is MUST_COMPLETE unless a separate encounter/survival override applies."
        - "Do not clip earlier than the final channel boundary."
        - "Do not treat Precise Shots as a generic Rapid Fire interrupt condition."
        - "Disable this optimization if Blizzard fixes the delayed-consumption interaction."

  precise_shots_two_target_split:
    status: PROVISIONAL
    condition: "Aspect of the Hydra talented and active_enemies >= 2"
    raid_or_non_priority_context:
      action: "Prefer Multi-Shot over Arcane Shot as the Precise Shots spender on exactly 2 targets when not in a DungeonRoute priority-target context."
      rationale: "SimC commit 2d51405 explicitly changes 2-target raid/non-DungeonRoute behavior to Multi-Shot to maximize total 2-target damage."
    dungeonroute_priority_target_context:
      action: "On exactly 2 targets, prefer Arcane Shot for Precise Shots when DungeonRoute priority damage is active; Multi-Shot becomes allowed again at 3+ targets."
      rationale: "The new APL preserves M+ priority-target efficiency rather than blindly maximizing 2-target aggregate damage."
    automation:
      branch_inputs:
        - active_enemies
        - fight_style_dungeonroute
        - max_prio_damage
        - aspect_of_the_hydra_talented
        - precise_shots_up
      policy: "if active_enemies == 2 AND dungeonroute AND max_prio_damage => Arcane Shot; otherwise on 2+ eligible targets => Multi-Shot"

  explosive_shot_priority_routing:
    status: PROVISIONAL
    season2_4pc_multidot:
      action: "Allow Explosive Shot target-cycling/multidotting with the Season 2 4pc only when not in a DungeonRoute max-priority-damage context."
      priority_target_exception: "In DungeonRoute priority-target situations, do not cycle Explosive Shot across secondary targets solely for the 4pc; keep the normal priority-target Explosive Shot action instead."
      rationale: "SimC commit 2d51405 removes Explosive Shot multidotting in priority-target DungeonRoute situations."
    automation:
      gate: "mid2_4pc AND active_enemies > 1 AND (NOT max_prio_damage OR NOT dungeonroute) AND tactical_reload_lock_and_load_gate"

  aoe_focus_dump:
    status: PROVISIONAL
    action: "In Dark Ranger/Sentinel AoE lists, use Multi-Shot as a Focus dump before Steady Shot when enough Focus remains to pay Multi-Shot and still reserve the cost of an Aimed Shot, under the max-priority-damage branch."
    admission: "focus > multishot_cost + aimed_shot_cost AND max_prio_damage"
    purpose: "Avoid unnecessary Focus overcap while preserving the next Aimed Shot."
    automation:
      state_inputs:
        - focus
        - multishot_cost
        - aimed_shot_cost
        - max_prio_damage
      policy: "dump only above the reserve threshold; never spend the Aimed Shot reserve"

  trueshot_explosive_shot_alignment:
    status: PROVISIONAL
    action: "Outside opener/end-of-fight overrides, delay Trueshot by up to roughly 15 seconds when Explosive Shot will become available within that window, so the two can be aligned."
    simc_condition: "Trueshot ready remains false unless Explosive Shot is ready or its cooldown remains is at least 15 seconds; fight-remains and early-fight overrides still bypass the hold."
    practical_conflict: "Current public Wowhead guidance still generally recommends activating Trueshot when it naturally lines up before Aimed Shot / after Rapid Fire, and does not yet document a 15-second Explosive Shot hold."
    automation:
      admission: "allow_trueshot_if(explosive_shot_ready OR explosive_shot_cd >= 15s OR opener_override OR execute/fight_end_override OR non_bullseye_build)"
      safeguard: "Do not convert this into a universal 15-second hard hold; DungeonRoute pull timing, imminent downtime, and fight-end logic must override."

  rapid_fire_two_target_targeting:
    status: PROVISIONAL
    action: "On pure non-DungeonRoute 2-target encounters, Rapid Fire may target-swap to the target without Sentinel's Mark to improve aggregate damage; do not use this routing in DungeonRoute priority-damage contexts."
    rationale: "SimC commit 7ba3610 adds a target_if Rapid Fire line only when !fight_style.dungeonroute and explicitly notes priority-damage loss in DungeonRoute."
    automation:
      gate: "active_enemies == 2 AND NOT dungeonroute AND aggregate_damage_objective"
      target_policy: "prefer target with Sentinel's Mark down when the pure-2T aggregate branch is active; otherwise keep priority-target routing"

  hydra_rapid_fire_tick_behavior:
    status: PROVISIONAL_HIGH_CONFIDENCE
    behavior: "With Aspect of the Hydra, the secondary-target Rapid Fire copy now triggers on every Rapid Fire channel tick in the current SimC live model; the previous 2026-08-14 bugs-mode assumption that Hydra fired only on every other tick has been removed."
    impact:
      - "This materially raises the modeled value of Rapid Fire in Hydra cleave and makes secondary-target routing more important in 2-target/low-target aggregate-damage scenarios."
      - "It does not by itself prove a new GCD priority order; the existing Rapid Fire, Precise Shots, Trueshot and priority-target branches remain in force until live logs/theorycraft show a rotation rewrite is warranted."
      - "Because Rapid Fire contributes more complete Hydra replication than the old every-other-tick model, do not use the superseded half-frequency assumption in damage forecasting or target-selection heuristics."
    practical_context: "Current Wowhead Midnight guidance already treats Aspect of the Hydra as a powerful 2-target cleave option and states that Hydra-based AoE follows the single-target priority naturally, but public guides do not document the now-removed every-other-tick bug model."
    automation:
      damage_model: "When Aspect of the Hydra is active, account for a Hydra secondary event on every Rapid Fire tick rather than alternating ticks."
      target_policy: "Keep TOTAL_DAMAGE versus PRIORITY_TARGET routing explicit; increased Hydra replication is not permission to swap off a dangerous priority target in M+."
      clipping_safeguard: "Do not change the Unload final-boundary clipping admission solely because Hydra now fires every tick; validate the final tick and Hydra secondary event under live latency before promoting clipping to production."

