spec: Marksmanship Hunter
version: 12.1
updated: 2026-08-16
status: PROVISIONAL
scope:
  talent: Unload
  mechanic: Rapid Fire channel-end / Precise Shots consumption
rules:
  unload_precise_shots_channel_end:
    behavior: "The second Unload shot fired at Rapid Fire channel end consumes Precise Shots on a slight delay on live behavior as modeled by SimC bugs mode."
    theoretical_optimization:
      action: "Interrupt Rapid Fire at the final channel boundary when fewer than 2 ticks remain, Precise Shots is active, and the GCD is available, then immediately spend Precise Shots so both the second Unload shot and the spender can benefit."
      status: PROVISIONAL
      rationale: "SimulationCraft first modeled the delayed consumption in commit 94f7e089, then adopted the optimization directly into the Marksmanship APL in commit 6cad471 with interrupt_if=ticks_remain<2&buff.precise_shots.up&!gcd.remains, interrupt_immediate=1, interrupt_global=1 across Dark Ranger and Sentinel ST/AoE lists."
    practical_baseline:
      action: "Complete Rapid Fire normally, then spend Precise Shots with Arcane Shot on single target or Multi-Shot where appropriate."
      status: STABLE_PRACTICAL
      rationale: "Current public Wowhead and Method practical guides still describe the normal full-channel flow and do not document deliberate final-tick Rapid Fire clipping."
    automation:
      cast_policy: "CAN_CLIP_IF(ticks_remain < 2 AND precise_shots_up AND gcd_ready AND valid_precise_shots_spender AND no_higher_priority_interrupt_risk)"
      state_inputs:
        - unload_talented
        - rapid_fire_channeling
        - rapid_fire_ticks_remain
        - gcd_remaining
        - precise_shots_stacks
        - target_count
        - trick_shots_state
        - hero_tree
        - arcane_shot_usable
        - multi_shot_usable
        - black_arrow_or_kill_shot_spender_state
        - latency_or_execution_margin
      safeguards:
        - "Do not clip earlier than the final channel boundary; SimC's production APL condition is specifically ticks_remain<2 with GCD ready."
        - "Do not treat the optimization as a generic Precise Shots interrupt rule outside Rapid Fire."
        - "Exact player-facing timing remains LIVE_VERIFY because public practical guides have not yet adopted the clipping behavior."
        - "Disable this optimization if Blizzard fixes the delayed-consumption interaction."
evidence:
  simc:
    mechanic_commit: 94f7e089da69c54b46d40a7a553e81f15334d4c7
    apl_commit: 6cad47161bcb93bbe2af1125d5d753483982143c
    apl_date: 2026-08-15
    summary: "The Marksmanship APL now actively interrupts Rapid Fire when ticks_remain<2, Precise Shots is up, and the GCD is free, in Dark Ranger and Sentinel single-target/AoE branches."
  practical:
    wowhead:
      summary: "Current Marksmanship guide says Precise Shots should be spent after Aimed Shot/Rapid Fire and still lists Rapid Fire as a normal cooldown/channel; it does not document deliberate final-boundary clipping."
    method:
      summary: "Current Marksmanship guide prioritizes keeping Rapid Fire/Aimed Shot rolling and preventing Precise Shots overcap; it does not document deliberate final-boundary clipping."
  official:
    summary: "Blizzard documents Unload's extra shot at Rapid Fire start/end but does not document the delayed Precise Shots consumption interaction."
