spec: Marksmanship Hunter
version: 12.1
updated: 2026-08-24
status: PROVISIONAL
scope:
  hero_talents:
    - Dark Ranger
    - Sentinel
  mechanics:
    - Rapid Fire channel-end / Precise Shots consumption
    - single-target versus AoE Rapid Fire clipping
    - hero-talent-specific AoE Rapid Fire clipping
    - Precise Shots ordering around Rapid Fire
    - 2-target Precise Shots spender selection
    - Explosive Shot priority-target routing
    - AoE Focus dumping
    - Trueshot / Explosive Shot cooldown alignment
    - 2-target Rapid Fire target routing
    - Aimed Shot nameplate routing
    - Aspect of the Hydra Rapid Fire tick behavior
    - Moonlight Chakram bounce travel time and Trueshot containment
rules:
  rapid_fire_clipping_context_split:
    status: PROVISIONAL_HIGH_CONFIDENCE
    supersedes: "The earlier universal Unload final-boundary clipping branch that applied to both single-target and all AoE hero-talent branches."
    single_target:
      action: "Do not deliberately clip Rapid Fire on single-target. Complete the channel unless a separate encounter/survival override applies."
      rationale: "SimC removed interrupt_if from both Dark Ranger ST and Sentinel ST Rapid Fire."
      cast_policy: MUST_COMPLETE
    aoe:
      sentinel:
        action: "With Unload talented, deliberate final-boundary Rapid Fire clipping remains legal in Sentinel AoE when fewer than 2 ticks remain, Precise Shots is active, the GCD is ready, and a legal Multi-Shot spender exists."
        cast_policy: "CAN_CLIP_IF(sentinel AND aoe_context AND unload_talented AND ticks_remain < 2 AND precise_shots_up AND gcd_ready AND valid_aoe_precise_shots_spender)"
      dark_ranger:
        action: "Do not deliberately clip Rapid Fire in Dark Ranger AoE; complete the channel by default."
        cast_policy: MUST_COMPLETE
    safeguards:
      - "Never infer that an optimization proven for Sentinel AoE should also run for Dark Ranger AoE or single-target."
      - "Do not clip earlier than the final channel boundary."
      - "If target count falls to one during a Sentinel channel, default back to MUST_COMPLETE unless the runtime can prove the AoE clipping event remains net-positive."

  single_target_precise_shots_before_rapid_fire:
    status: PROVISIONAL_HIGH_CONFIDENCE
    behavior: "On Sentinel ST with Unload + No Scope, Rapid Fire may be cast while Precise Shots is already active instead of always spending that Precise Shots first."
    automation:
      gate: "single_target AND sentinel AND unload_talented AND no_scope_talented AND precise_shots_up AND rapid_fire_ready"
      safeguard: "This is a talent-specific ST admission rule, not a generic reason to overcap Precise Shots in other builds."

  precise_shots_two_target_split:
    status: PROVISIONAL
    condition: "Aspect of the Hydra talented and active_enemies >= 2"
    raid_or_non_priority_context:
      action: "Prefer Multi-Shot over Arcane Shot as the Precise Shots spender on exactly 2 targets when not in a DungeonRoute priority-target context."
    dungeonroute_priority_target_context:
      action: "On exactly 2 targets, prefer Arcane Shot for Precise Shots when DungeonRoute priority damage is active; Multi-Shot becomes allowed again at 3+ targets."
    automation:
      policy: "if active_enemies == 2 AND dungeonroute AND max_prio_damage => Arcane Shot; otherwise on 2+ eligible targets => Multi-Shot"

  aimed_shot_nameplate_routing:
    status: PROVISIONAL
    behavior: "In Sentinel AoE, prefer the target with Sentinel's Mark for Aimed Shot where the current APL branch allows it; do not universally pin max-priority target solely because DungeonRoute priority damage is enabled."
    automation:
      safeguard: "Encounter overrides may still pin a must-kill target when failure cost exceeds modeled aggregate gain."

  explosive_shot_priority_routing:
    status: PROVISIONAL
    season2_4pc_multidot:
      action: "Allow Explosive Shot target-cycling/multidotting with the Season 2 4pc only when not in a DungeonRoute max-priority-damage context."
      priority_target_exception: "In DungeonRoute priority-target situations, do not cycle Explosive Shot across secondary targets solely for the 4pc."

  aoe_focus_dump:
    status: PROVISIONAL
    action: "Use Multi-Shot as a Focus dump before Steady Shot only when enough Focus remains to reserve the next Aimed Shot cost and the applicable damage-objective branch allows it."
    safeguard: "Never spend the Aimed Shot reserve."

  trueshot_explosive_shot_alignment:
    status: PROVISIONAL
    action: "Outside opener/end-of-fight overrides, allow a configurable Trueshot delay of up to roughly 15 seconds when Explosive Shot will become available inside that window."
    safeguard: "Do not convert this into a universal hard hold; DungeonRoute pull timing, imminent downtime, and losing a full Trueshot use override the alignment."

  rapid_fire_two_target_targeting:
    status: PROVISIONAL
    action: "On pure non-DungeonRoute 2-target encounters, Rapid Fire may target-swap to the target without Sentinel's Mark to improve aggregate damage; do not use this routing in DungeonRoute priority-damage contexts."

  hydra_rapid_fire_tick_behavior:
    status: PROVISIONAL_HIGH_CONFIDENCE
    behavior: "With Aspect of the Hydra, the secondary-target Rapid Fire copy triggers on every Rapid Fire channel tick in the corrected current live model; do not use the superseded alternating-tick assumption."
    automation:
      damage_model: "Account for a Hydra secondary event on every Rapid Fire tick."
      target_policy: "Keep TOTAL_DAMAGE versus PRIORITY_TARGET routing explicit."

  moonlight_chakram_trueshot_containment:
    status: PROVISIONAL_HIGH_CONFIDENCE
    source_commit: 9ad671eaff67a2344a3ec0646f0d7d4a2557cf52
    source_date: 2026-08-24
    behavior:
      single_target: "Model Moonlight Chakram bounces at roughly 640 ms intervals; the full damage sequence is materially slower than previously modeled."
      multi_target: "Model Moonlight Chakram bounces at roughly 130 ms intervals; multi-target completion is much faster than single-target."
    apl_change: "In Sentinel ST, the re-use/late-window condition changes from Moonlight Chakram buff remains < one GCD to remains < 5 seconds so the complete bounce sequence lands inside Trueshot."
    practical_interpretation: "Moonlight Chakram should be treated as a projectile/bounce sequence with future damage events, not as damage fully realized when the button is pressed."
    automation:
      state_order:
        - "TRUESHOT_REMAINS"
        - "MOONLIGHT_CHAKRAM_BOUNCE_CONTEXT"
        - "TARGET_COUNT"
        - "CAST_ADMISSION"
      single_target_gate: "Do not wait until the final GCD of Trueshot to cast Moonlight Chakram. Reserve enough remaining Trueshot time for the slower ST bounce sequence; SimC currently uses a 5-second buff-remains threshold."
      aoe_gate: "Do not blindly reuse the ST 5-second threshold for multi-target because the observed bounce interval is much shorter (~130 ms). Keep the target-count/travel model explicit."
      safeguard: "If runtime cannot observe individual bounce completion, use the theoretical timing only as a configurable admission margin; do not delay a final Moonlight Chakram so long that the cast itself is lost."
    conflict:
      practical_guides: "Method 12.1 (updated 2026-08-17) and Wowhead 12.1 (updated 2026-08-15) currently say to use Moonlight Chakram near/end of Trueshot, but predate the 2026-08-24 measured travel-time correction and do not distinguish the ~640 ms ST versus ~130 ms AoE bounce cadence."
      resolution: "Use the new timing model for the SimC benchmark; keep the exact practical safety margin LIVE_VERIFY until guides/log sequences refresh."

evidence:
  simc:
    latest_apl_commit: 9ad671eaff67a2344a3ec0646f0d7d4a2557cf52
    latest_apl_date: 2026-08-24
    summary: "Moonlight Chakram travel/bounce timing was corrected to ~640 ms per bounce on ST and ~130 ms on multi-target, and the Sentinel ST APL now starts the late Trueshot Chakram at <5s remaining rather than waiting until <1 GCD."
  practical:
    method:
      date_context: 2026-08-17_12.1
      summary: "Current Sentinel priorities place Moonlight Chakram at the end of Trueshot, but the guide predates the newly measured ST/AoE bounce timing correction."
    wowhead:
      date_context: 2026-08-15_12.1
      summary: "Current priority likewise says to cast Moonlight Chakram when Trueshot is about to expire; it does not yet document the 5-second ST containment margin."
  official:
    summary: "No Blizzard rotation note defines an exact Trueshot safety margin for Moonlight Chakram; the current timing is an observed live-mechanic/theorycraft model."
confidence:
  single_target_no_clip: HIGH_SIMC_AND_PRACTICAL
  sentinel_aoe_final_boundary_clip: HIGH_SIMC_PROVISIONAL_PRACTICAL
  dark_ranger_aoe_no_clip: HIGH_SIMC_PROVISIONAL_LIVE
  sentinel_st_rapid_fire_into_precise_shots: HIGH_SIMC_PROVISIONAL_PRACTICAL
  two_target_raid_vs_dungeonroute_split: HIGH_SIMC_PROVISIONAL_PRACTICAL
  hydra_rapid_fire_every_tick: HIGH_SIMC_PROVISIONAL_LIVE
  moonlight_chakram_travel_model: HIGH_SIMC_MEASURED_PROVISIONAL_LIVE
production_recommendation:
  stable_practical:
    - "Single-target Rapid Fire: complete the channel for both hero trees."
    - "Dark Ranger AoE Rapid Fire: complete the channel by default."
    - "Sentinel AoE Rapid Fire: allow final-boundary Multi-Shot clipping only with Unload/Precise Shots/GCD conditions."
    - "Keep priority-target exceptions for Precise Shots spending."
    - "Preserve Aimed Shot Focus reserve before low-priority AoE dumps."
  provisional_machine_logic:
    - "Gate Rapid Fire clipping by HERO_STATE before evaluating AoE context."
    - "Allow Sentinel ST Rapid Fire before consuming existing Precise Shots only for Unload + No Scope."
    - "Use explicit TOTAL_DAMAGE versus PRIORITY_TARGET branches for exactly 2 targets."
    - "Keep Hydra every-tick secondary-event modeling."
    - "For Sentinel ST Trueshot, begin Moonlight Chakram containment planning before the final GCD; current SimC benchmark uses a 5-second remaining threshold because ST bounces are much slower than AoE."
live_verify:
  - "Validate Sentinel ST Moonlight Chakram casts around 4-6 seconds remaining in Trueshot and confirm all bounce damage remains inside the buff in current live logs."
  - "Validate the observed ~640 ms ST and ~130 ms multi-target bounce cadence across latency/target-spacing cases."
  - "Compare updated high-end Sentinel guides/logs after 2026-08-24 for adoption of the earlier ST Moonlight Chakram timing."
  - "Continue validating Sentinel AoE Rapid Fire final-boundary clipping and Dark Ranger full-channel behavior."
