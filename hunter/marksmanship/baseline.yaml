production_recommendation:
  stable_practical:
    - "Do not clip Rapid Fire without Unload."
    - "Preserve Aimed Shot Focus reserve before low-priority AoE dumps."
    - "Do not target-swap Rapid Fire in DungeonRoute priority-damage contexts solely for aggregate 2T gain."
    - "Do not model Aspect of the Hydra Rapid Fire as only firing on alternating channel ticks."
  provisional_machine_logic:
    - "Use explicit raid-vs-DungeonRoute priority branches for exactly 2 targets."
    - "Suppress Explosive Shot multidot cycling in DungeonRoute priority-target mode."
    - "Enable final-boundary Rapid Fire clipping only for Unload builds after latency-safe live validation."
    - "Allow a configurable Trueshot hold up to ~15s for Explosive Shot alignment outside opener/fight-end/route overrides."
    - "Enable Sentinel pure-2T Rapid Fire target swapping only for aggregate-damage objectives outside DungeonRoute."
    - "For Hydra builds, include a secondary Hydra Rapid Fire event for every channel tick in damage/target forecasting."
live_verify:
  - "Season 2 live data is now available but still early; compare Hydra Rapid Fire secondary-event counts against primary Rapid Fire ticks in current 12.1 logs."
  - "Compare 2T Rapid Fire target distribution in raid cleave versus M+ priority-target pulls."
  - "Validate whether high-end players actually hold Trueshot for Explosive Shot by 5-15 seconds and under which fight-length / Bullseye states."
  - "Validate AoE Focus-dump frequency and whether the reserve rule ever delays Aimed Shot under realistic movement/latency."
  - "Validate Rapid Fire clip safety only in Unload builds and confirm no lost final tick/Hydra/Unload event."
