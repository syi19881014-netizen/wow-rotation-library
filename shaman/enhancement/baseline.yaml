spec: Enhancement Shaman
version: 12.1
updated: 2026-08-24
status: PROVISIONAL
scope:
  hero_talents:
    - Stormbringer
    - Totemic
  mechanics:
    - Thorim's Invocation during Doom Winds / Ascendance
    - Thunder Capacitor Maelstrom Weapon refunds
    - Tempest refund behavior
    - Precombat Crash Lightning buff setup
rules:
  thorims_invocation_activation:
    status: HIGH_CONFIDENCE_MECHANIC
    behavior: "During Doom Winds or Ascendance, eligible activators discharge Thorim's Invocation and consume Maelstrom Weapon for the primed spender."
    ascendance_crash_lightning:
      action: "Crash Lightning must trigger Thorim's Invocation while Ascendance is active, not only during Doom Winds."
      rationale: "SimulationCraft commit 351fcec corrected its engine check from Doom Winds only to Doom Winds OR Ascendance; current Wowhead 12.1 guidance already describes Crash Lightning and Windstrike as Thorim's Invocation activators during Ascendance."
    automation:
      state_gate: "doom_winds_up OR ascendance_up"
      policy: "When the gate is active, treat eligible activators as simultaneous Maelstrom spend events through Thorim's Invocation; do not schedule a redundant manual spender solely to empty Maelstrom."

  thunder_capacitor_refund:
    status: HIGH_CONFIDENCE_MECHANIC
    behavior: "Thunder Capacitor can refund the Maelstrom Weapon stacks actually consumed by Lightning Bolt, Chain Lightning, or Tempest, including eligible Thorim's Invocation variants."
    tempest:
      action: "Tempest is an eligible Thunder Capacitor refund source when it consumed Maelstrom Weapon."
      rationale: "SimulationCraft commit 76042c6 added Thunder Capacitor refund handling to Tempest and retained the normal/Thorim's Invocation variant gate."
    zero_spend_safeguard:
      action: "Do not roll or credit a Thunder Capacitor refund when no Maelstrom Weapon stacks were consumed."
      rationale: "SimulationCraft commit 96ddc9b added an explicit mw_consumed_stacks > 0 condition to prevent false refund triggers."
    automation:
      refund_event: "on_valid_spender_resolve AND maelstrom_spent > 0 AND thunder_capacitor_proc => restore maelstrom_spent"
      consequence: "Immediately refresh resource state after a refund; do not assume the Thorim's Invocation activation emptied Maelstrom."
      anti_overcap: "Because refunds can instantly return up to the amount spent, re-evaluate Maelstrom cap pressure before the next strike/GCD, especially inside Ascendance/Doom Winds where Static Accumulation and repeated Thorim's Invocation triggers create high generation."

  cooldown_window_resource_policy:
    status: STABLE_PRACTICAL_WITH_CORRECTED_MODEL
    stormbringer_ascendance:
      action: "Prioritize Crash Lightning and Windstrike activators; rely on Thorim's Invocation to perform spending during the window rather than inserting normal manual Lightning Bolt/Tempest casts just to dump Maelstrom."
    totemic_doom_winds:
      action: "Prioritize Crash Lightning / Stormstrike activators while respecting Totemic Hot Hand / Lava Lash window rules; Thorim's Invocation handles the Maelstrom spend when active."
    refund_exception:
      action: "If Thunder Capacitor refunds the spent Maelstrom, the next-state calculation must use the refunded resource immediately; this can raise overcap risk but does not by itself justify breaking the core activator priority."

  precombat_crash_lightning:
    status: PROVISIONAL_HIGH_CONFIDENCE
    behavior: "Crash Lightning can be used before combat to begin the pull with the Crash Lightning buff already active without dealing damage or starting combat; current high-end 12.1 guidance explicitly uses a ~1 second pre-cast in major Stormbringer openers and selected Totemic single-target openers."
    simc_model:
      action: "Use the dedicated precombat Crash Lightning state rather than treating it as a normal harmful cast."
      semantics:
        - "Precombat execution triggers the Crash Lightning buff."
        - "It does not create Crash Lightning puddles or initiate combat."
        - "The buff begins with duration reduced by the pre-pull offset."
        - "No hit-dependent procs, Maelstrom spend, Windfury-style impact callbacks, or target-hit side effects should fire from the no-target precombat event."
    practical:
      stormbringer_st: "Pre-cast Crash Lightning roughly 1 second before pull when the encounter allows a clean pre-pull action; then proceed into the normal Voltaic Blaze / Stormstrike / Ascendance sequence."
      stormbringer_aoe: "Same pre-pull Crash Lightning setup is supported when the opening pack is already in position and the cast will not accidentally engage early."
      totemic_st: "Current Wowhead 12.1 sample sequence also uses the pre-cast in single target."
      totemic_aoe: "Do not universalize the pre-cast: the current published Totemic AoE sample sequence does not require it, so keep this branch encounter/build configurable."
    automation:
      phase: PREPULL_PREPARATION
      gate: "pull_timer_valid AND crash_lightning_ready AND precombat_context_allowed"
      preferred_offset: "~1.0s before pull; configurable and latency-aware"
      execution_policy: "Fire once in pre-pull only. Do not allow the normal combat Crash Lightning handler to double-submit the same setup cast."
      pull_safety: "Disable when pre-pull spell execution could body-pull, break encounter scripting, or when the runtime cannot reliably distinguish harmless precombat state from a real harmful cast."
      first_combat_tick: "Re-read Crash Lightning buff remains and cooldown at combat start; never assume the pre-cast succeeded solely from a submitted action."

practical_comparison:
  simc_theoretical:
    summary: "The latest SimC engine corrections increase the fidelity of Enhancement resource flow by allowing Ascendance Crash Lightning to trigger Thorim's Invocation, by allowing Tempest to refund consumed Maelstrom through Thunder Capacitor, and now by modeling the pre-pull Crash Lightning buff setup without fake combat-side effects."
  high_end_practical:
    summary: "Current Wowhead 12.1 opener guidance explicitly includes a roughly 1-second pre-cast Crash Lightning in Stormbringer single-target/AoE and selected Totemic single-target sequences. This gives the opener an already-active Crash Lightning buff without spending the first combat GCD on setup."
  stable_player:
    summary: "If a clean pull timer is available, pre-cast Crash Lightning about one second before combat. If the pull is messy or the cast risks early engagement, skip it rather than desynchronizing the opener. Inside Ascendance/Doom Winds, keep the corrected Thorim/Thunder Capacitor resource model."
  encounter_specific:
    summary: "Pre-pull Crash Lightning is encounter- and routing-sensitive. It is valuable on controlled raid pulls and prepared M+ starts, but should not be forced on chain-pulls, accidental-combat situations, or Totemic AoE routes where the published opener does not depend on it."

evidence:
  simc:
    crash_lightning_thorim_commit: 351fcec671c8c88b9fc042244fc9e6532a3074ba
    thunder_capacitor_zero_spend_commit: 96ddc9b5f53bdc46890eb58afc0f2371086aa8a3
    tempest_refund_commit: 76042c6127cf0ac8f8a3cc12847f921f8c4b1dc1
    precombat_crash_lightning_commit: e6f5b00266c5591c26ffb72ffc1fc82d6935f9e1
    latest_date: 2026-08-23
  practical:
    wowhead:
      summary: "Current Midnight Enhancement opener guidance explicitly lists Pre-cast Crash Lightning 1 second before pulling for Stormbringer single-target and AoE sequences and for the published Totemic single-target sequence; the Totemic AoE sample does not require it."
    method:
      summary: "Current Method 12.1 guide confirms Crash Lightning remains a top-priority Stormbringer action and Season 2 strongly favors Stormbringer after acquiring the new tier set, supporting the value of beginning the opener with its state pre-established."
  official:
    summary: "No Blizzard note was found that turns the pre-pull technique into a mandatory universal opener; treat the exact pre-pull timing as practical/SimC-supported rather than an official rotation mandate."
confidence:
  thorims_invocation_ascendance_crash_lightning: HIGH
  thunder_capacitor_tempest_refund: HIGH
  resource_overcap_policy: HIGH_PRACTICAL
  precombat_crash_lightning_state: HIGH
  universal_precast_across_all_builds_and_routes: LOW
  core_priority_rewrite_required: false
production_recommendation:
  - "Add PREPULL_PREPARATION support for a single Crash Lightning approximately 1 second before controlled pulls."
  - "At combat start, verify the real Crash Lightning buff/cooldown state before entering the opener."
  - "Keep the pre-cast conditional by hero/build/encounter; do not force it on every Totemic AoE or chain-pull situation."
  - "Keep the current high-end Ascendance/Doom Winds activator priority and corrected Thorim/Thunder Capacitor resource model."
