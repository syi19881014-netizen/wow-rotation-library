  S2_BLOOD_DEBT_MARROWREND:
    status: PROVISIONAL
    enabled_when: S2_SET_ACTIVE
    rule_summary:
      - "At 10 Blood Debt stacks, evaluate Dancing Rune Weapon alignment before consuming."
      - "If DRW is imminent, hold consumption for the final pre-DRW GCD when appropriate."
      - "If a pull is ending and the next pack is soon, holding for the next pack can be beneficial."
