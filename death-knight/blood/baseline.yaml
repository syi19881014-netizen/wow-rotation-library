mechanic_corrections:
  ECHOING_FURY_REAPERS_MARK_2026_08_19:
    status: STABLE
    evidence:
      - "SimulationCraft commit 980e112 (2026-08-19 UTC) removes the Blood bug model where casting Reaper's Mark itself granted an Echoing Fury Exterminate stack."
      - "Current Wowhead Blood guidance describes the prior behavior as a bug and lists Echoing Fury's intended Blood trigger as Dancing Rune Weapon."
    rules:
      - "Do not grant an Echoing Fury Exterminate stack when Reaper's Mark is cast."
      - "Dancing Rune Weapon remains the Echoing Fury trigger for the extra Blood Exterminate stack."
      - "Normal Exterminate generated by Reaper's Mark detonation remains separate and unchanged."
      - "Runtime forecasting must not count a pre-detonation Exterminate charge from Reaper's Mark cast itself."
    rotation_impact:
      core_priority_rewrite: false
      notes:
        - "Reaper's Mark remains an on-cooldown offensive priority unless encounter timing overrides it."
        - "The correction mainly changes Exterminate/Bone Shield/resource forecasting around the Mark -> detonation window."
