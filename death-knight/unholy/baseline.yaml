  lord_of_the_dead_cast_timing: true
  eruption_target_modifier_behavior: true
  soul_reaper_blightfall_exact_live_timing: true
  encounter_vulnerability_eruption_behavior: true
  note: "2026-08-26 SimC added current-live bug behavior where Dread Plague/Virulent Plague eruption damage ignores target damage-taken modifiers. Core player priority is not fully rewritten, but burst valuation and any logic that tries to place Blightfall/eruption-heavy actions inside Soul Reaper or encounter vulnerability windows must be corrected."
