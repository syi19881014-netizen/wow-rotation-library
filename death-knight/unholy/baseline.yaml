    note: "SimC bugs-mode now divides target damage-taken multipliers back out of Dread Plague/Virulent Plague eruption damage for Superstrain erupts, Blightfall consumption erupts, and Scourge Strike eruption damage. This is a burst-valuation correction: ordinary plague ticks can still benefit from normal target modifiers, while the eruption portion should not be forecast as amplified by Soul Reaper or encounter vulnerability modifiers unless live evidence proves a specific exception."
