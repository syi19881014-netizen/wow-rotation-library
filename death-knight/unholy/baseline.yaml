automation:
  priority_rewrite_required: false
  execution_policy_updates:
    - Treat Dark Transformation as an off-GCD cooldown even when Blightfall is talented.
    - Do not reserve or consume a player GCD for Dark Transformation itself; only the follow-up/replacement Blightfall action participates in its own shared GCD.
    - Allow Dark Transformation to be woven alongside the normal highest-value GCD action when API/runtime execution ordering permits.
  state_model_updates:
    - Do not model Epidemic Order as a DK-side proxy action that additionally triggers Rune of the Apocalypse.
    - When a qualifying San'layn execute-talent trigger occurs, trigger Transfusion across all active Lesser Ghouls.
    - For Unholy, model each Transfusion application as an 8-second pet buff and allow overlapping/repeated applications; do not hard-cap each ghoul at one stack unless later live evidence establishes a cap.
    - Remove the old Lord of the Dead Magus Frostbolt shortened-GCD bug assumption.
  safeguards:
    - Do not invent a hold rule solely from the Dark Transformation GCD correction; it changes execution scheduling, not the underlying priority target or cooldown valuation.
    - Do not double-submit Blightfall in the same execution slot as Dark Transformation; resolve the replacement/shared-GCD action separately after the transformation state is established.
    - Do not invent a new player GCD or hold rule solely from these pet-side fixes.
    - Keep Army of the Dead Scourge Strike ordering driven by nearby-enemy Order selection; player does not directly choose Death Order vs Epidemic Order.
    - Do not promote the exact maximum Transfusion stack count to STABLE until live-log or spell-data evidence confirms it.
