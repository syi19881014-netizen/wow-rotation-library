    - "Method 12.1 (updated 2026-08-12) likewise keeps the ordinary DoT maintenance, Dark Harvest and shard-spend framework."
  interpretation: "The 2026-08-22 SimC changes are primarily live-mechanic/state corrections. They can alter tier/hero-value simulations and runtime state forecasting, but current evidence does not justify replacing the public practical GCD priority."

