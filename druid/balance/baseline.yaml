spec: balance_druid
wow_version: "12.1 / Midnight"
status: PROVISIONAL
updated: 2026-08-16

scope:
  focus: "Season 2 AoE / Mythic+ execution and opener"
  source_of_truth_role: "theoretical + theorycrafter APL branch; practical live validation pending"

evidence:
  simulationcraft:
    repo: simulationcraft/simc
    commit: f172b7e7bc5971c31c9a2ee17ca6dd81eb3f591f
    date_utc: 2026-08-16
    message: "[Balance] fix AoE"
  theorycrafter:
