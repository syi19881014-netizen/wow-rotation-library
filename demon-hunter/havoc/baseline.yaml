spec: Havoc Demon Hunter
version: "12.1 / Midnight Season 2"
updated: 2026-08-18
status: PROVISIONAL
scope:
  source_change: "SimulationCraft Season 2 APL rewrite + MID2 4pc Essence Break CDR correction"
  season_start: 2026-08-18
summary:
  - "SimC PR #11740 replaced the prior highly conditional Havoc APL with a much shorter Season 2 priority list."
  - "The rewrite materially changes cooldown admission and de-emphasizes several old heuristic variables for Inertia, Eye Beam alignment, Blade Dance thresholds, Fury forecasting, and Burning Wound retargeting."
  - "2026-08-17 SimC correction confirms Eye Beam reducing Essence Break through Cycle of Hatred is a MID2 4pc-only interaction; no-4pc / pre-4pc branches must not receive this CDR."
  - "Public practical guides are still behind the new Season 2 theoretical branch and cannot yet be treated as full confirmation of the new ordering."
rules:
  season2_simc_core:
    status: PROVISIONAL
    priority_notes:
      - "Pre-Metamorphosis Immolation Aura is explicitly admitted for Violent Transformation + A Fire Inside when Metamorphosis is within ~3 GCDs."
      - "Metamorphosis is admitted when Chaotic Transformation does not need to hold for Blade Dance/Eye Beam, and Demonsurge Death Sweep/Annihilation are not pending."
      - "The Hunt is gated by Eternal Hunt / Eye Beam / Metamorphosis state and by Reaver's Glaive not being active."
      - "Vengeful Retreat remains a timing tool around Eye Beam/Metamorphosis but the old broad Inertia-consumer heuristic tree was removed."
      - "Reaver's Glaive is used when both Rending Strike and Glaive Flurry are down; subsequent Annihilation/Death Sweep consume hero-talent states."
      - "Eye Beam is now an explicit high-priority rotational action rather than passing through the old eb_aligned variable tree."
      - "Essence Break is admitted when Eye Beam remains >4s; Death Sweep is prioritized during Essence Break or Demonsurge windows."
      - "Blade Dance / Death Sweep become broadly rotational again after higher hero/cooldown states instead of the old target-count use_blade_dance heuristic."
      - "A Fire Inside + Burning Wound Immolation Aura charge-capping prevention is retained in simplified form."
  mid2_4pc_cycle_of_hatred:
    status: PROVISIONAL_HIGH_CONFIDENCE
    hard_gate: "MID2_HAVOC_4PC_EQUIPPED"
    rules:
      - "Eye Beam may reduce Essence Break cooldown through Cycle of Hatred only when the Midnight Season 2 Havoc 4pc is actually equipped."
      - "The interaction is not baseline Havoc behavior and must not be active in launch/no-set, 2pc-only, or broken-4pc gear states."
      - "When Cycle of Hatred stacks 2-4 are applied under the 4pc, Eye Beam can reduce Essence Break according to the live mechanic modeled by SimC; exact cadence remains gear/build dependent."
    forbidden:
      - "Do not forecast Essence Break cooldown from Eye Beam as though this CDR exists without the 4pc."
      - "Do not let the Season 2 set branch contaminate no-set SimC-equivalence tests or pre-4pc production logic."
  practical_current:
    status: STABLE_PRACTICAL_12_0_7
    notes:
      - "Wowhead still describes Havoc around keeping Blade Dance, Immolation Aura, and Eye Beam on cooldown, aligning Essence Break to every second Eye Beam, and pairing Vengeful Retreat with Eye Beam for Inertia/Initiative."
      - "Until 12.1 Season 2 raid/M+ logs and updated class-guide/theorycrafter evidence mature, do not replace the current practical production branch wholesale with the new SimC APL."
automation:
  architecture:
    - "Separate hero-tree state (Fel-Scarred vs Aldrachi Reaver) from cooldown admission."
    - "Evaluate equipped-set state before any Cycle of Hatred -> Essence Break CDR prediction."
    - "Evaluate pending Demonsurge actions before Metamorphosis admission."
    - "Track Eye Beam remaining, Metamorphosis remaining/ready, Blade Dance cooldown, Essence Break debuff/cooldown, Reaver's Glaive/Rending Strike/Glaive Flurry, Inertia/Initiative, Immolation Aura charges, Fury, target count, and MID2 set-piece state."
    - "Do not preserve deleted SimC helper variables as hard production rules unless live evidence independently supports them."
  recommended_policy:
    simc_branch: "Use Season 2 SimC ordering for theoretical benchmark simulations, with MID2 4pc mechanics enabled only when the profile actually has the 4pc."
    production_branch: "Keep practical alignment safeguards until Season 2 live evidence validates the rewrite; no-4pc branches must use native Essence Break cooldown behavior."
    migration: "Promote individual Season 2 rules to STABLE only after guide/log/theorycrafter confirmation; preserve conflicts explicitly."
