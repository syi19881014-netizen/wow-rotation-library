spec: retribution_paladin
wow_version: "12.1 / Midnight"
updated: 2026-08-23
status: PROVISIONAL

source_of_truth:
  simc_commit: e4fda8cc0de6415e65c1eb54433938db5442b7da
  simc_date_utc: 2026-08-22
  public_guides:
    - source: Wowhead Retribution Paladin Rotation Guide
      state: "12.1 guide updated 2026-08-17; recommends stacking Crusade quickly, but still puts Execution Sentence/cooldown value ahead of blindly rushing stacks; Hammer of Light should normally follow Wake of Ashes immediately"
    - source: Method Retribution Paladin 12.1 Rotation Guide
      state: "12.1 guide updated 2026-08-12; Templar opener uses Wake of Ashes -> Hammer of Light and describes Crusade as a Holy-Power-spend ramp during Avenging Wrath"

material_update:
  summary:
    - "Divine Storm admission remains explicit on generic 2+ targets, with additional Divine Arbiter / Empyrean Power / Seal of the Templar / Dawnlight state gates."
    - "Blade of Justice proc protection remains a 2-stack Art of War / Righteous Cause overcap rule rather than a single-proc force-cast."
    - "NEW 2026-08-22 live-bug model: when Crusade is active, Hammer of Light is observed/modelled by SimC bugs mode as granting 9 Crusade stacks, independent of its current 3 Holy Power cost."
    - "The 9-stack behavior is not treated as intended design or a permanent rotation law; it is isolated as a LIVE_BUG branch because SimC only enables the override when bugs mode is active."

state_machine:
  FINISHER_BRANCH:
    inputs:
      - effective_targets
      - holy_power
      - empyrean_legacy
      - empyrean_power
      - divine_arbiter_verdict
      - divine_arbiter_divine_storm
      - seal_of_the_templar
      - dawnlight
      - hammer_of_light_ready
      - hammer_of_light_free
    rules:
      - when: "effective_targets >= 2 and not empyrean_legacy and Divine Arbiter special-state gates do not suppress Divine Storm"
        action: "admit Divine Storm before Templar's Verdict"
      - when: "effective_targets == 1"
        action: "default to Templar's Verdict unless a proc/state-specific Divine Storm rule is explicitly satisfied"
      - when: "hammer_of_light_ready and not hammer_of_light_free"
        action: "preserve Hammer of Light priority over ordinary finishers"

  GENERATOR_PROC_PRESSURE:
    inputs:
      - art_of_war_stacks
      - righteous_cause_stacks
      - walk_into_light
      - avenging_wrath
    rules:
      - when: "art_of_war_stacks == 2 or righteous_cause_stacks == 2"
        action: "raise Blade of Justice to prevent proc-stack waste, subject to Walk Into Light / Avenging Wrath gate"
      - when: "only one proc stack is present"
        action: "do not automatically force Blade of Justice above finishers/cooldowns solely for that proc"

  CRUSADE_HAMMER_OF_LIGHT_LIVE_BUG:
    status: PROVISIONAL_LIVE_BUG
    inputs:
      - crusade_talented
      - avenging_wrath_active
      - hammer_of_light_cast_success
      - live_bug_mode
      - crusade_stacks
    rules:
      - when: "crusade_talented and avenging_wrath_active and hammer_of_light_cast_success and live_bug_mode"
        action: "expect Crusade to jump by 9 stacks after Hammer of Light; immediately refresh the actual Crusade stack count instead of adding Holy Power cost"
      - when: "live_bug_mode is false or Blizzard fixes the behavior"
        action: "fall back to intended spend-based Crusade stacking and remove the 9-stack override"
    safeguards:
      - "Do not delay Execution Sentence merely to force an earlier 9-stack Hammer of Light; current Wowhead guidance still prioritizes putting Execution Sentence on cooldown before obsessing over Crusade ramp speed."
      - "Do not assume every Hammer of Light proc should be consumed instantly: existing guide rules still allow holding a free Hammer of Light briefly for Avenging Wrath / Execution Sentence / relevant proc alignment."
      - "After Hammer of Light, read the live Crusade stack value from the game if the runtime API can do so; do not rely on prediction because this behavior is explicitly bug-scoped."

production_policy:
  simc_benchmark:
    status: HIGH_CONFIDENCE_THEORY_WITH_LIVE_BUG_BRANCH
    rule: "mirror current 12.1 finisher/proc gates; when validating against SimC bugs mode, model Hammer of Light as 9 Crusade stacks during active Crusade"
  practical_production:
    status: LIVE_VERIFY
    rule: "keep current Templar opener/priority; exploit no special hold beyond existing Wake -> Hammer of Light timing, but refresh Crusade stacks immediately because live behavior may jump by 9"
  stable_human_simplification:
    rule: "2+ meaningful targets generally Divine Storm; protect Holy Power from overcap; prioritize Blade of Justice more aggressively only at 2 proc stacks; with Crusade, use Hammer of Light in its normal high-priority window rather than inventing a separate bug-fishing sequence"

runtime_notes:
  - "Do not encode Divine Storm as a target-count-only switch; the 12.1 APL has state-dependent suppression/admission around Divine Arbiter and Empyrean effects."
  - "Track Art of War / Righteous Cause stack counts, not booleans, for proc-overcap prevention."
  - "Track Crusade stacks from live aura state after Hammer of Light. SimC commit e4fda8c models 9 stacks only in bugs mode; this can be hotfixed at any time and must remain kill-switchable."
  - "Keep exact 12.1 practical validation PROVISIONAL until current live raid/M+ sequence evidence accumulates."
